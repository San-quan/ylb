<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作日志 - 私域引流宝</title>
    <link href="../../static/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../static/css/ylb.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; padding: 20px; }
        .log-item { 
            background: #fff; 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 8px;
            border-left: 4px solid #0d6efd;
        }
        .log-time { color: #666; font-size: 12px; }
        .log-user { color: #0d6efd; font-weight: bold; }
        .log-ip { color: #999; font-size: 12px; }
        .log-action { font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>操作日志</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="location.reload()">刷新</button>
            </div>
            <div class="card-body">
                <div id="logList"></div>
                <div class="text-center mt-3">
                    <button class="btn btn-primary" onclick="loadMore()">加载更多</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../../static/js/jquery.min.js"></script>
    <script>
    let page = 1;
    function loadLogs() {
        $.get('getOperationLog.php', {page: page}, function(res) {
            if(res.code === 200) {
                let html = '';
                res.data.forEach(function(log) {
                    html += '<div class="log-item">';
                    html += '<div class="log-time">' + log.time + '</div>';
                    html += '<div class="log-action">' + log.action + '</div>';
                    html += '<div>用户: <span class="log-user">' + (log.user || '系统') + '</span></div>';
                    html += '<div class="log-ip">IP: ' + log.ip + '</div>';
                    if(log.detail) {
                        html += '<div class="text-muted">' + log.detail + '</div>';
                    }
                    html += '</div>';
                });
                if(page === 1) {
                    $('#logList').html(html);
                } else {
                    $('#logList').append(html);
                }
            }
        });
    }
    function loadMore() {
        page++;
        loadLogs();
    }
    loadLogs();
    </script>
</body>
</html>
