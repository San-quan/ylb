<body>

<div id="app">
	
	<!-- 左侧 -->
	<div class="left">
		<div class="dhview">

			<!-- LOGO -->

			<!-- 导航 -->
			<ul>

			<div class="account">加载中...</div>

		<div class="data-card">

			<div class="button-view" id="button-view" style="display:none;">
			    
			    <!--flex布局按钮容器-->
			    <div class="flex-button-view">

    			    <div class="button-gongneng"></div>
			    </div><!-- flex-button-view -->

				    <tbody></tbody>

			<div class="fenye"></div>

            <div class="modal-content">

                <div class="modal-header">
                    <h4 class="modal-title">确定清空</h4>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div><!-- modal-header -->
                
                <!-- 内容 -->
                <div class="modal-body">
                    将会清空所有IP地址记录且无法恢复！
                </div><!-- modal-body -->
                
                <!-- 底部操作 -->
                <div class="modal-footer"></div><!-- modal-footer -->
                
                <!-- 操作反馈 -->
                <div class="result"></div>
                
            </div><!-- modal-content -->
        </div><!-- modal-dialog -->
    </div><!-- cleanIPAddressModal -->
    
    <!-- 全局信息提示框 -->
    <div id="notification">
        <div id="notification-text"></div>
    </div>
