<!DOCTYPE html>
<html>
<head>
	<title></title>
	<meta charset="utf-8">
	<link rel="stylesheet" href="../../../../static/css/bootstrap.min.css">
	<link rel="stylesheet" href="./static/bootstrap-icons/font/bootstrap-icons.css">
	<link rel="stylesheet" href="../../../../static/css/ylb.css">
	<link rel="shortcut icon" href="../../../../static/img/logo.png">
	<script type="text/javascript" src="../../../../static/js/jquery.min.js"></script>
	<script type="text/javascript" src="../../../../static/js/popper.min.js"></script>
	<script type="text/javascript" src="../../../../static/js/bootstrap.min.js"></script>
	<script type="text/javascript" src="../../../../static/js/qrcode.min.js"></script>
	<script type="text/javascript">
        var timestamp = new Date().getTime();
        var script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = './app.js?v=' + timestamp;
        document.head.appendChild(script);
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = './app.css?v=' + timestamp;
        document.head.appendChild(link);
    </script>
    <script type="text/javascript" src="../../../../static/js/getNavList.js"></script>
</head>
<body>
    
    <div id="app">
    	
    	<div class="left">
	    
    		<!--左侧菜单-->
    		<div class="dhview">
    			<a href="../index/" class="index">
    			    <div class="logo"></div>
    			</a>
    			<ul id="navList"></ul>
    			<div class="account"></div>
    		</div>
	    </div>
    
    	<!-- 右侧 -->
    	<div id="right">
    	    
    	    <!--面板标题-->
    		<h3>
    		    <a href="../../" class="mianbaoxie_a">插件中心</a> ➜ <span class="mbx">域名检测任务（版本：1.2.0）</span> 
		    </h3>
		    
		    <!--数据区域-->
    		<div class="data-card">
    		    
    		    <!-- 按钮区域 -->
    			<div class="btn-view">
    			    
                    <div style="display: flex; gap: 8px;">
                        <a href="../../">
                            <div class="back-lastpage"></div>
                        </a>
        				<button class="default-btn">任务列表</button>
        				<button class="tint-btn" onclick="getNotify()">通知渠道</button>
                    </div>
                    
                    <div style="display: flex; gap: 8px; margin-left: auto;">
                        <button 
                            class="tint-btn" 
                            data-toggle="modal" 
                            data-target="#createTaskModal" 
                            onclick="getdomainOrLinks()">
                            <i class="bi bi-plus-lg"></i> 创建任务
                        </button>
                    </div>
                </div>
    		    
    			<!-- 列表区域 -->
    			<div class="data-list">
    			    
    				<table class="table">
    				    <thead></thead>
    				    <tbody></tbody>
    				</table>
    			</div><!-- data-list -->
    			
    			<p class="loading" style="display: none;"></p>
    			
    			<!-- 分页 -->
    			<div class="fenye"></div>
    			
    		</div><!-- data-card -->
    	</div><!-- right -->
    
    	<!-- 创建任务 -->
        <div class="modal fade" id="createTaskModal">
            
            <div class="modal-dialog" style="max-width:600px;">
                <div class="modal-content">
                    
                    <!-- 头部 -->
                    <div class="modal-header">
                        <h4 class="modal-title">创建任务</h4>
                        <button type="button" class="close" data-dismiss="modal">&times;</button>
                    </div>

                    <!-- 表单 -->
                    <div class="modal-body">
                        <form id="createTask">
                        <span class="text">检测的域名或链接</span>
                        <select name="domainOrLinks" class="form-control" title="已添加到域名库中的域名或链接"></select>
                        
                        <span class="otherdomainOrLinks" style="display:none;">
                            <span class="text">输入其它域名或链接</span>
                            <input type="text" name="otherdomainOrLinks" class="form-control" autocomplete="off" placeholder="输入被检测的域名">
                        </span>
                        
                        <span class="text">通知方式</span>
                        <div class="notiType">
                            <span class="type_btn" data-type="no_noti">不通知</span>
                            <span class="type_btn" data-type="bark" title="域名检测到被封后将会发送通知提醒到你iPhone手机安装的Bark App">iOS Bark</span>
                            <span class="type_btn" data-type="qywx" title="域名检测到被封后将会发送通知提醒给你的企业微信应用">企业微信</span>
                        </div>
                        <input type="hidden" name="notiType" />
                        
                        </form>
                    </div><!-- modal-body -->
                        
                    <!-- 底部操作 -->
                    <div class="modal-footer">
                        <div class="footer-btn">
                            <div class="faqnav" title="阅读使用文档">
                                <span class="faq">
                                    <a href="https://viusosibp88.feishu.cn/docx/EcJ8dOupdoZEPvxCcwVccVcBnYf" target="_blank">?</a>
                                </span>
                            </div>
                            <div class="btnnav">
                                <button type="button" class="default-btn" onclick="createTask();"><i class="bi bi-plus-lg"></i> 立即创建</button>
                            </div>
                        </div>
                        
                    </div><!-- modal-footer -->
                    
                    <!-- 操作反馈 -->
                    <div class="result"></div>
                    
                </div><!-- modal-content -->
            </div><!-- modal-dialog -->
        </div><!-- createTaskModal -->
      	
      	<!-- 删除任务 -->
        <div class="modal fade" id="delTaskModal">
            
            <div class="modal-dialog">
                <div class="modal-content">
                    
                    <!-- 头部 -->
                    <div class="modal-header">
                        <h4 class="modal-title">删除任务</h4>
                        <button type="button" class="close" data-dismiss="modal">&times;</button>
                    </div>
                    
                    <!-- 内容 -->
                    <div class="modal-body">
                        将会删除该任务！删除后无法恢复。
                    </div>
                    
                    <!-- 底部操作 -->
                    <div class="modal-footer"></div>
                    
                    <!-- 操作反馈 -->
                    <div class="result"></div>
                    
                </div><!-- modal-content -->
            </div><!-- modal-dialog -->
        </div><!-- delTaskModal -->
        
        <!-- 通知渠道 -->
        <div class="modal fade" id="notifyModal">
            
            <div class="modal-dialog">
                <div class="modal-content">
                    
                    <!-- 头部 -->
                    <div class="modal-header">
                        <h4 class="modal-title">通知渠道</h4>
                        <button type="button" class="close" data-dismiss="modal">&times;</button>
                    </div>
                    
                    <!-- 内容 -->
                    <div class="modal-body">
                        <form id="saveNotify">
                            <span class="text">企业微信Appid</span>
                            <input type="text" name="Appid" class="form-control" autocomplete="off" placeholder="Appid">
                            
                            <span class="text">企业微信AppSecret</span>
                            <input type="text" name="AppSecret" class="form-control" autocomplete="off" placeholder="AppSecret">
                            
                            <span class="text">企业微信AgentId</span>
                            <input type="text" name="AgentId" class="form-control" autocomplete="off" placeholder="应用ID">
                            
                            <span class="text">企业微信toUser</span>
                            <input type="text" name="toUser" class="form-control" autocomplete="off" placeholder="接收人ID">
                            
                            <span class="text">iOS Bark URL</span>
                            <input type="text" name="BarkUrl" class="form-control" autocomplete="off" placeholder="Bark服务器链接">
                        </form>
                        <button type="button" class="default-btn center-btn" style="margin-top:25px;" onclick="saveNotify()">
                            保存配置
                        </button>
                        
                        <a href="https://rcn7yg9nflbn.feishu.cn/wiki/TKlawz8q8i4TKrkssPWchr2enSf?from=from_copylink" target="_blank" style="text-align:center;font-size:13px;display:block;margin-top:15px;">点击查看配置文档</a>
                    </div>
                    
                    <!-- 底部操作 -->
                    <div class="modal-footer" style="padding:0;">
                        <p style="font-size:13px;display:block;color:#999;margin:15px auto 0;">
                            注意：企业微信还需配置IP白名单才可以正常使用，具体情查看配置文档。
                        </p>
                    </div>
                    
                    <!-- 操作反馈 -->
                    <div class="result"></div>
                    
                </div><!-- modal-content -->
            </div><!-- modal-dialog -->
        </div><!-- notifyModal -->
        
        <!-- 全局信息提示框 -->
        <div id="notification">
            <div id="notification-text"></div>
        </div>
    
    </div><!-- app -->

</body>
</html>
